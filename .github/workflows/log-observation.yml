name: Log Wind Observations

# Runs every 30 minutes — fetches live observations for all stations vs AROME
# and appends NDJSON rows to data/{station}.ndjson on the data-log branch.
#
# One commit per run covers all stations (avoids push conflicts).
# Cost: ~2 min/run × 48 runs/day = ~96 min/day (well within 2,000 free minutes).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout data-log branch
        uses: actions/checkout@v5
        with:
          ref: data-log
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: One-time migration — move observations.ndjson → data/torbole.ndjson
        run: |
          mkdir -p data
          if [ -f data/observations.ndjson ] && [ ! -f data/torbole.ndjson ]; then
            echo "Migrating observations.ndjson → data/torbole.ndjson"
            cp data/observations.ndjson data/torbole.ndjson
          fi

      - name: Fetch snapshots for all stations
        run: |
          BASE="https://garda-wind.vercel.app/api/snapshot"
          STATIONS="torbole riva malcesine bardolino peschiera"

          for STATION in $STATIONS; do
            RESPONSE=$(curl -sf --max-time 25 "${BASE}?station=${STATION}" || echo "null")

            if [[ "$RESPONSE" == \{* ]]; then
              echo "$RESPONSE" >> "data/${STATION}.ndjson"
              echo "✓ ${STATION}: logged"
            else
              echo "✗ ${STATION}: no data (skipping)"
            fi
          done

      - name: Commit and push
        run: |
          git config user.name  "wind-logger[bot]"
          git config user.email "wind-logger@garda-wind"

          git add data/

          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          TS=$(date -u +%Y-%m-%dT%H:%MZ)
          git commit -m "obs: $TS"
          git push
